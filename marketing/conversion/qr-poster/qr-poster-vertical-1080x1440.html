<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>麥客不停 · 扫码关注</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=Inter:wght;800;900@700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #1a1d1c; }

  .poster {
    width: 1080px;
    height: 1440px;
    background: linear-gradient(180deg, #101010 0%, #101d33 100%);
    position: relative;
    overflow: hidden;
    font-family: "Noto Sans SC", sans-serif;
    color: #fffaf0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 80px 50px;
  }

  /* 装饰光晕 */
  .poster::before {
    content: "";
    position: absolute;
    top: -300px;
    right: -300px;
    width: 800px;
    height: 800px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(230, 0, 18, 0.12) 0%, transparent 65%);
    z-index: 1;
  }
  .poster::after {
    content: "";
    position: absolute;
    bottom: -200px;
    left: -200px;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(242, 199, 102, 0.06) 0%, transparent 60%);
    z-index: 1;
  }

  /* 顶部 Logo 区 */
  .logo-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    z-index: 2;
    margin-bottom: 36px;
  }
  .brand-lockup {
    width: 360px;
    height: auto;
  }
  .logo-mai {
    font-family: "Inter", sans-serif;
    font-size: 24px;
    letter-spacing: 8px;
    color: #e60012;
    text-transform: lowercase;
  }
  .logo-zh {
    font-size: 56px;
    font-weight: 900;
    letter-spacing: 0.04em;
    color: #fffaf0;
  }

  /* 主标题 */
  .hero {
    text-align: center;
    z-index: 2;
    margin-bottom: 36px;
  }
  .kicker {
    font-family: "Inter", sans-serif;
    font-size: 16px;
    letter-spacing: 6px;
    color: #e60012;
    margin-bottom: 14px;
    text-transform: uppercase;
  }
  .h1 {
    font-size: 72px;
    font-weight: 900;
    line-height: 1.1;
    letter-spacing: 0.02em;
    color: #fffaf0;
    margin-bottom: 18px;
  }
  .h1 .accent { color: #e60012; }
  .subline {
    font-size: 26px;
    font-weight: 400;
    color: rgba(255, 250, 240, 0.7);
    letter-spacing: 0.06em;
    line-height: 1.5;
  }

  /* QR 卡片 */
  .qr-card {
    z-index: 2;
    background: #fffaf0;
    border-radius: 22px;
    padding: 36px 36px 32px;
    text-align: center;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
    margin-bottom: 28px;
    position: relative;
  }
  /* 二维码外框 - 给真实二维码预留位置 */
  .qr-frame {
    width: 380px;
    height: 380px;
    background: #ffffff;
    border-radius: 12px;
    margin: 0 auto 28px;
    display: grid;
    place-items: center;
    position: relative;
    overflow: hidden;
  }
  .qr-frame img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  /* 占位符样式 - Master 替换为真实二维码后删除 */
  .qr-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background:
      linear-gradient(45deg, #f0f0f0 25%, transparent 25%),
      linear-gradient(-45deg, #f0f0f0 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #f0f0f0 75%),
      linear-gradient(-45deg, transparent 75%, #f0f0f0 75%);
    background-size: 24px 24px;
    background-position: 0 0, 0 12px, 12px -12px, -12px 0px;
    background-color: #ffffff;
    color: #999;
    font-family: "Inter", sans-serif;
    font-size: 18px;
    text-align: center;
    line-height: 1.6;
  }
  .qr-placeholder .icon {
    font-size: 80px;
    color: #ccc;
    margin-bottom: 16px;
  }

  .qr-label-zh {
    font-size: 36px;
    font-weight: 900;
    color: #101010;
    letter-spacing: 0.04em;
    margin-bottom: 8px;
  }
  .qr-label-en {
    font-family: "Inter", sans-serif;
    font-size: 16px;
    color: rgba(16, 16, 16, 0.55);
    letter-spacing: 4px;
    text-transform: lowercase;
  }

  /* 底部信息 */
  .footer {
    z-index: 2;
    text-align: center;
    margin-top: auto;
  }
  .footer-line {
    width: 80px;
    height: 2px;
    background: linear-gradient(90deg, transparent, #e60012, transparent);
    margin: 0 auto 28px;
  }
  .footer-slogan {
    font-size: 36px;
    font-weight: 700;
    letter-spacing: 0.18em;
    color: #fffaf0;
    margin-bottom: 12px;
  }
  .footer-slogan-en {
    font-family: "Inter", sans-serif;
    font-size: 16px;
    letter-spacing: 6px;
    color: rgba(255, 250, 240, 0.4);
    text-transform: lowercase;
  }
</style>
</head>
<body>
<div class="poster">

  <!-- 顶部 Logo -->
  <div class="logo-area">
    <img class="brand-lockup" src="../../../../brand/logos/transparent/mai-lockup-bilingual-dark-transparent-cropped.png" alt="麥客不停 MAI UNSTOPPABLE">
  </div>

  <!-- 主标题 -->
  <div class="hero">
    <div class="kicker">scan · follow · never stop</div>
    <h1 class="h1">
      看完这一集<br>
      <span class="accent">想看更多？</span>
    </h1>
    <div class="subline">扫码关注「麥客不停」<br>每周一集，一人公司的真实日常</div>
  </div>

  <!-- QR 卡片 -->
  <div class="qr-card">
    <div class="qr-frame">
      <!-- ============================================ -->
      <!-- ⬇️ 替换为真实二维码图片路径                  -->
      <!-- <img src="qrcode.jpg" alt="QR Code" />      -->
      <!-- ============================================ -->
      <div class="qr-placeholder">
        <div class="icon">▣</div>
        <div>替换为二维码<br>替换方法见 README</div>
      </div>
    </div>
    <div class="qr-label-zh">扫码关注</div>
    <div class="qr-label-en">scan to follow</div>
  </div>

  <!-- 底部 Slogan -->
  <div class="footer">
    <div class="footer-line"></div>
    <div class="footer-slogan">麥客不停 · 创作不止</div>
    <div class="footer-slogan-en">mai always on</div>
  </div>

</div>
</body>
</html>
