<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>麥客不停 · 扫码关注（方形版）</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=Inter:wght;800;900@700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #1a1d1c; }

  .poster {
    width: 1080px;
    height: 1080px;
    background: linear-gradient(160deg, #101010 0%, #101d33 100%);
    position: relative;
    overflow: hidden;
    font-family: "Noto Sans SC", sans-serif;
    color: #fffaf0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 100px 80px;
  }

  /* 装饰光晕 */
  .poster::before {
    content: "";
    position: absolute;
    top: -200px;
    left: -200px;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(230, 0, 18, 0.10) 0%, transparent 65%);
    z-index: 1;
  }

  /* 内容容器 */
  .content {
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }

  /* 顶部 Logo 区 */
  .logo-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    margin-bottom: 36px;
  }
  .brand-lockup {
    width: 320px;
    height: auto;
  }
  .logo-mai {
    font-family: "Inter", sans-serif;
    font-size: 22px;
    letter-spacing: 6px;
    color: #e60012;
    text-transform: lowercase;
  }
  .logo-zh {
    font-size: 48px;
    font-weight: 900;
    letter-spacing: 0.04em;
    color: #fffaf0;
  }

  /* 主标题 */
  .hero {
    text-align: center;
    margin-bottom: 44px;
  }
  .kicker {
    font-family: "Inter", sans-serif;
    font-size: 14px;
    letter-spacing: 5px;
    color: #e60012;
    margin-bottom: 14px;
    text-transform: uppercase;
  }
  .h1 {
    font-size: 56px;
    font-weight: 900;
    line-height: 1.2;
    letter-spacing: 0.02em;
    color: #fffaf0;
  }
  .h1 .accent { color: #e60012; }

  /* QR 卡片 */
  .qr-card {
    background: #fffaf0;
    border-radius: 20px;
    padding: 36px 36px 30px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    margin-bottom: 36px;
  }
  .qr-frame {
    width: 360px;
    height: 360px;
    background: #ffffff;
    border-radius: 10px;
    margin: 0 auto 20px;
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  .qr-frame img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  /* 占位符 */
  .qr-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background:
      linear-gradient(45deg, #f0f0f0 25%, transparent 25%),
      linear-gradient(-45deg, #f0f0f0 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #f0f0f0 75%),
      linear-gradient(-45deg, transparent 75%, #f0f0f0 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    background-color: #ffffff;
    color: #999;
    font-family: "Inter", sans-serif;
    font-size: 14px;
    text-align: center;
    line-height: 1.6;
  }
  .qr-placeholder .icon {
    font-size: 60px;
    color: #ccc;
    margin-bottom: 12px;
  }

  .qr-label-zh {
    font-size: 26px;
    font-weight: 900;
    color: #101010;
    letter-spacing: 0.04em;
    margin-bottom: 6px;
  }
  .qr-label-en {
    font-family: "Inter", sans-serif;
    font-size: 12px;
    color: rgba(16, 16, 16, 0.55);
    letter-spacing: 3px;
    text-transform: lowercase;
  }

  /* 底部信息 */
  .footer {
    text-align: center;
  }
  .footer-slogan {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.18em;
    color: #fffaf0;
  }
  .footer-slogan-en {
    font-family: "Inter", sans-serif;
    font-size: 12px;
    letter-spacing: 5px;
    color: rgba(255, 250, 240, 0.4);
    text-transform: lowercase;
    margin-top: 6px;
  }
</style>
</head>
<body>
<div class="poster">
  <div class="content">

    <!-- 顶部 Logo -->
    <div class="logo-area">
      <img class="brand-lockup" src="../../../../brand/logos/transparent/mai-lockup-bilingual-dark-transparent-cropped.png" alt="麥客不停 MAI UNSTOPPABLE">
    </div>

    <!-- 主标题 -->
    <div class="hero">
      <div class="kicker">scan · follow · never stop</div>
      <h1 class="h1">
        扫码关注<br>
        <span class="accent">麥客不停</span>
      </h1>
    </div>

    <!-- QR 卡片 -->
    <div class="qr-card">
      <div class="qr-frame">
        <!-- ⬇️ 替换为真实二维码图片 -->
        <!-- <img src="qrcode.jpg" alt="QR Code" /> -->
        <div class="qr-placeholder">
          <div class="icon">▣</div>
          <div>替换为二维码</div>
        </div>
      </div>
      <div class="qr-label-zh">扫码关注</div>
      <div class="qr-label-en">scan to follow</div>
    </div>

    <!-- 底部 Slogan -->
    <div class="footer">
      <div class="footer-slogan">麥客不停 · 创作不止</div>
      <div class="footer-slogan-en">mai always on</div>
    </div>

  </div>
</div>
</body>
</html>
